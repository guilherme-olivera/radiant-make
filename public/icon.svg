<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="radiantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e84a75" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Fundo Arredondado com Gradiente Radiant -->
  <rect width="512" height="512" rx="128" fill="url(#radiantGrad)" />
  
  <!-- Círculo interno sutil -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.12" />
  
  <!-- Ícone de Brilho / Estrela Radiant Make -->
  <g filter="url(#shadow)">
    <!-- Estrela Central de 4 pontas -->
    <path d="M256 90 Q256 220 126 256 Q256 292 256 422 Q256 292 386 256 Q256 220 256 90 Z" fill="#ffffff" />
    
    <!-- Pequena estrela satélite topo direita -->
    <path d="M370 120 Q370 150 340 160 Q370 170 370 200 Q370 170 400 160 Q370 150 370 120 Z" fill="#ffe4e6" />
    
    <!-- Pequena estrela satélite base esquerda -->
    <path d="M140 340 Q140 365 115 375 Q140 385 140 410 Q140 385 165 375 Q140 365 140 340 Z" fill="#ffe4e6" />
  </g>
</svg>

